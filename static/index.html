<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Root SPA</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/react-router-dom@6/umd/react-router-dom.development.js"></script>
</head>
<body>
  <div id="root">Loading...</div>
  <script type="text/javascript">
    const { BrowserRouter, Routes, Route, Link } = ReactRouterDOM;
    const { useState, useEffect } = React;

    function Home() {
      return React.createElement("h2", null, "🏠 Root Home");
    }

    function Page1() {
      return React.createElement("h2", null, "📄 Root Page 1");
    }

    function ApiResponse() {
      const [data, setData] = useState("Loading...");
      useEffect(() => {
        fetch("/api/hello")
          .then(res => res.json())
          .then(d => setData(JSON.stringify(d, null, 2)))
          .catch(err => setData("❌ " + err.message));
      }, []);
      return React.createElement("pre", null, data);
    }

    function App() {
      return React.createElement(
        "div",
        null,
        React.createElement("h1", null, "🌐 Root React SPA"),
        React.createElement("nav", null,
          React.createElement(Link, { to: "/" }, "Home"), " | ",
          React.createElement(Link, { to: "/page1" }, "Page 1"), " | ",
          React.createElement("a", { href: "/subpath1/" }, "Subpath 1"), " | ",
          React.createElement("a", { href: "/subpath2/" }, "Subpath 2")
        ),
        React.createElement("hr"),
        React.createElement(ApiResponse),
        React.createElement(Routes, null,
          React.createElement(Route, { path: "/", element: React.createElement(Home) }),
          React.createElement(Route, { path: "/page1", element: React.createElement(Page1) })
        )
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(
      React.createElement(BrowserRouter, null, React.createElement(App))
    );
  </script>
</body>
</html>
