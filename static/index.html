<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Subpath 1 SPA</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- ✅ Load libraries first -->
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/react-router-dom@6/umd/react-router-dom.development.js"></script>
</head>
<body>
  <div id="root">Loading...</div>

  <!-- ✅ Your code comes after the libraries -->
  <script type="text/javascript">
    const { BrowserRouter, Routes, Route, Link } = ReactRouterDOM;
    const { useState, useEffect } = React;

    function Home() {
      return React.createElement("h2", null, "🏠 Subpath1 Home");
    }

    function PageA() {
      return React.createElement("h2", null, "📄 Subpath1 Page A");
    }

    function ApiResponse() {
      const [data, setData] = useState("Loading...");
      useEffect(() => {
        fetch("/api/hello")
          .then(res => res.json())
          .then(d => setData(JSON.stringify(d, null, 2)))
          .catch(err => setData("❌ " + err.message));
      }, []);
      return React.createElement("pre", null, data);
    }

    function App() {
      return React.createElement(
        "div",
        null,
        React.createElement("h1", null, "📦 Subpath1 React SPA"),
        React.createElement("nav", null,
          React.createElement(Link, { to: "/subpath1" }, "Home"), " | ",
          React.createElement(Link, { to: "/subpath1/page-a" }, "Page A"), " | ",
          React.createElement("a", { href: "/" }, "Back to Root")
        ),
        React.createElement("hr"),
        React.createElement(ApiResponse),
        React.createElement(Routes, null,
          React.createElement(Route, { path: "/subpath1", element: React.createElement(Home) }),
          React.createElement(Route, { path: "/subpath1/page-a", element: React.createElement(PageA) })
        )
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(
      React.createElement(BrowserRouter, null, React.createElement(App))
    );
  </script>
</body>
</html>
